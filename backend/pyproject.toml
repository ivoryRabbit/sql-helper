[project]
name = "sql-helper-backend"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    # server
    "fastapi[standard]==0.128.0",
    "uvicorn[standard]==0.37.0",
    "slowapi==0.1.9",
    # database
    "sqlalchemy==2.0.43",
    "psycopg[binary]==3.2.10",
    "pgvector==0.4.1",
    # coroutine
    "greenlet==3.2.4",
    # data model
    "pydantic==2.12.5",
    "pydantic-settings==2.11.0",
    "sqlmodel==0.0.26",
    "orjson==3.11.3",
    "dependency-injector==4.48.2",
    # vector embedding
    "sentence-transformers==4.1.0",
    # encryption
    "cryptography==43.0.3",
    # http client
    "httpx==0.28.1",
    # text-to-sql
    "openai==1.82.0",
    "google-generativeai==0.8.5",
    "anthropic==0.52.0",
    "sqlparse==0.5.3",
    # object storage
    "boto3==1.38.0",
    # workflow orchestration
    "temporalio==1.9.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
pythonpath = ["src"]
addopts = "-v --tb=short"
log_cli = true
log_cli_level = "WARNING"
log_level = "WARNING"

[tool.uv]
package = false
