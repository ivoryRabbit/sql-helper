services:
  postgres:
    container_name: postgres
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vectordb
      POSTGRES_USER: sqlhelper
      POSTGRES_PASSWORD: sqlhelper
      TZ: Asia/Seoul
    volumes:
      - ./docker/postgres/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
      - ./docker/postgres/init_temporal.sql:/docker-entrypoint-initdb.d/init_temporal.sql
      - ./docker/volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "sqlhelper", "-d", "vectordb" ]
      start_period: 5s
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - sql-helper-network

  temporal:
    container_name: temporal
    image: temporalio/auto-setup:latest
    environment:
      - DB=postgres12
      - POSTGRES_SEEDS=postgres
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - DBNAME=temporal
      - DEFAULT_NAMESPACE=default
      - LOG_LEVEL=warn
    ports:
      - "7233:7233"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sql-helper-network

  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:latest
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8088:8080"
    depends_on:
      - temporal
    restart: unless-stopped
    networks:
      - sql-helper-network

  minio:
    container_name: minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sqlhelper}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sqlhelper}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./docker/volumes/minio:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      start_period: 5s
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - sql-helper-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sql-helper-backend
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: sqlhelper
      DB_PASSWORD: sqlhelper
      DB_NAME: vectordb
      TEMPORAL_ADDRESS: temporal:7233
      MINIO_ENDPOINT: minio:9000
      TZ: Asia/Seoul
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/ping" ]
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - sql-helper-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sql-helper-worker
    command: [ "python", "worker.py" ]
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: sqlhelper
      DB_PASSWORD: sqlhelper
      DB_NAME: vectordb
      TEMPORAL_ADDRESS: temporal:7233
      MINIO_ENDPOINT: minio:9000
      TZ: Asia/Seoul
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    restart: unless-stopped
    networks:
      - sql-helper-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://localhost:8000/api/v1
    container_name: sql-helper-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sql-helper-network

